<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automobili Lamborghini - Arte e Performance Italianas</title>
    
    <!-- Importação de fontes sofisticadas do Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800;900&family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        /* Variáveis de Cores e Temas */
        :root {
            --bg-dark: #0a0a0a;
            --bg-card: #141414;
            --gold-accent: #d4af37;
            --gold-hover: #f3e5ab;
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
            --border-color: #262626;
        }

        /* Reset e Configuração Geral */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Cabeçalho */
        header {
            background: linear-gradient(180deg, rgba(0,0,0,0.9) 0%, rgba(10,10,10,0.8) 100%);
            padding: 25px 20px;
            text-align: center;
            border-bottom: 2px solid var(--gold-accent);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(8px);
        }

        header h1 {
            font-family: 'Cinzel', serif;
            font-size: 2.2rem;
            color: var(--gold-accent);
            letter-spacing: 3px;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
        }

        header p {
            font-size: 0.9rem;
            color: var(--text-muted);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Seção Banner Hero */
        .hero {
            position: relative;
            height: 60vh;
            background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(10, 10, 10, 1)), 
                        url('https://images.unsplash.com/photo-1544829099-b9a0c07fad1a?auto=format&fit=crop&w=1600&q=80') center/cover no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        .hero-content h2 {
            font-family: 'Cinzel', serif;
            font-size: 3rem;
            color: var(--text-main);
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .hero-content p {
            font-size: 1.2rem;
            color: var(--text-muted);
            max-width: 700px;
            margin: 0 auto;
        }

        /* Container Principal */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        /* Seção Sobre */
        .sobre {
            text-align: center;
            margin-bottom: 60px;
        }

        .section-title {
            font-family: 'Cinzel', serif;
            font-size: 2rem;
            color: var(--gold-accent);
            text-align: center;
            margin-bottom: 30px;
            position: relative;
            display: inline-block;
        }

        .section-title::after {
            content: '';
            display: block;
            width: 50%;
            height: 2px;
            background-color: var(--gold-accent);
            margin: 8px auto 0 auto;
        }

        .sobre p {
            font-size: 1.1rem;
            color: var(--text-main);
            max-width: 800px;
            margin: 0 auto 15px auto;
        }

        /* Grid de Superesportivos */
        .modelos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 30px;
            margin-top: 30px;
        }

        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-8px);
            border-color: var(--gold-accent);
            box-shadow: 0 10px 25px rgba(212, 175, 55, 0.15);
        }

        .card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-bottom: 1px solid var(--border-color);
        }
