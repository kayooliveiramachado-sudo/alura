<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automobili Lamborghini - Design e Performance</title>
    
    <!-- Importação de fonte moderna do Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        /* Estilos Globais */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #0d0d0d;
            color: #ffffff;
            line-height: 1.6;
        }

        /* Cabeçalho */
        header {
            background-color: #000000;
            padding: 25px 20px;
            text-align: center;
            border-bottom: 3px solid #d4af37;
        }

        header h1 {
            color: #d4af37;
            font-size: 2.2rem;
            letter-spacing: 2px;
        }

        header p {
            color: #ffffff;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 5px;
        }

        /* Container Conteúdo */
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px 20px;
            text-align: center;
        }

        .section-title {
            color: #d4af37;
            font-size: 1.8rem;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .description {
            color: #ffffff;
            font-size: 1.05rem;
            max-width: 850px;
            margin: 0 auto 30px auto;
        }

        /* Grid de Pilares da Marca */
        .pilares {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-bottom: 50px;
        }

        .pilar-card {
            background-color: #151515;
            border-top: 3px solid #d4af37;
            border-radius: 6px;
            padding: 20px;
            width: 300px;
            text-align: center;
        }

        .pilar-card h3 {
            color: #d4af37;
            margin-bottom: 10px;
            font-size: 1.2rem;
        }

        .pilar-card p {
            color: #ffffff;
            font-size: 0.9rem;
        }

        /* Grid de Cards dos Modelos */
        .cards {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 25px;
            margin-top: 20px;
        }

        .card {
            background-color: #1a1a1a;
            border: 1px solid #333333;
            border-radius: 10px;
            width: 310px;
            overflow: hidden;
            text-align: left;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .card:hover {
            transform: translateY(-8px);
            border-color: #d4af37;
        }

        .card img {
            width: 100%;
            height: 190px;
            object-fit: cover;
        }

        .card-body {
            padding: 20px;
        }

        .card-body h3 {
            color: #d4af37;
            font-size: 1.4rem;
            margin-bottom: 10px;
        }

        .card-body p {
            color: #ffffff;
            font-size: 0.95rem;
            margin-bottom: 15px;
        }

        .specs {
            list-style: none;
            border-top: 1px solid #333333;
            padding-top: 10px;
            font-size: 0.85rem;
            color: #cccccc;
        }

        .specs span {
            color: #d4af37;
            font-weight: 600;
        }

        /* Rodapé */
        footer {
            background-color: #000000;
            text-align: center;
            padding: 25px 20px;
            margin-top: 60px;
            border-top: 2px solid #d4af37;
        }

        footer p {
            color: #ffffff;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>AUTOMOBILI LAMBORGHINI</h1>
        <p>Sant'Agata Bolognese - Itália</p>
    </header>

    <div class="container">
        
        <section>
            <h2 class="section-title">A História da Marca</h2>
            <p class="description">
                Fundada em 1963 por Fer
